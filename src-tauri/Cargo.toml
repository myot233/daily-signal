[package]
name = "daily-signal-desktop"
version = "1.0.0"
description = "Daily Signal desktop application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
open = "5"
rfd = "0.15"

[profile.release]
strip = true
lto = "thin"
